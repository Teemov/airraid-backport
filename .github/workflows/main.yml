name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "Could not find settings.gradle. Files in the repository:"
            find . -not -path './.git/*' -type f | head -100
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          echo "Building in: $(pwd)"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: airraid-forge-1.20.1
          path: '**/build/libs/airraid-*.jar'
